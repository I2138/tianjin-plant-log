<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>津城植物日志 · 城市植物共建观察平台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

<!-- 顶部 Header -->
<header class="header home-header">
  <div class="header-inner">
    <div class="brand">
      <span style="color:var(--primary-deep);display:flex" id="brandIcon"></span>
      <span>津城植物日志</span>
    </div>
    <div class="search-bar" id="searchBar">
      <span class="s-icon" id="sIcon"></span>
      <span class="s-loading"><div class="spinner" style="width:15px;height:15px;border-width:2px"></div></span>
      <input id="searchInput" type="search" placeholder="搜索植物中文名 / 拉丁名">
      <button class="s-clear" id="sClear"></button>
    </div>
  </div>
</header>

<!-- 横向筛选（可收起） -->
<div class="filter-zone collapsed" id="filterZone">
  <div class="filter-bar" id="filterBar">
    <span class="fb-label">
      <span class="fb-icon" id="fbIcon"></span>
      <span>筛选植物</span>
    </span>
    <span class="fb-result" id="fbResult"></span>
    <span class="fb-arrow" id="fbArrow"></span>
  </div>
  <div class="filter-body" id="filterBody">
    <div class="fz-row"><div class="chips-scroll" data-group="type">
      <span class="chip-label">类型</span>
      <button class="chip active" data-v="">全部</button>
      <button class="chip" data-v="乔木">乔木</button><button class="chip" data-v="灌木">灌木</button>
      <button class="chip" data-v="草本">草本</button><button class="chip" data-v="藤本">藤本</button>
      <button class="chip" data-v="水生">水生</button>
    </div></div>
    <div class="fz-row"><div class="chips-scroll" data-group="attr">
      <span class="chip-label">属性</span>
      <button class="chip active" data-v="">全部</button>
      <button class="chip" data-v="native">本土物种</button>
      <button class="chip" data-v="exotic">外来物种</button>
      <button class="chip" data-v="invasive">入侵物种</button>
    </div></div>
    <div class="fz-row"><div class="chips-scroll" data-group="season">
      <span class="chip-label">季节</span>
      <button class="chip active" data-v="">全部</button>
      <button class="chip" data-v="春季观花">春季观花</button>
      <button class="chip" data-v="夏季观叶">夏季观叶</button>
      <button class="chip" data-v="秋季彩叶">秋季彩叶</button>
      <button class="chip" data-v="冬季常绿">冬季常绿</button>
    </div></div>
    <div class="fz-row"><div class="chips-scroll" data-group="region">
      <span class="chip-label">区域</span>
      <button class="chip active" data-v="">全部区域</button>
    </div></div>
  </div>
</div>

<div class="page home-page">
  <!-- 科普社区入口 -->
  <div class="community-banner" data-nav="community.html" data-nav-text="正在前往科普社区">
    <div class="cb-icon" id="cbIcon"></div>
    <div>
      <div class="cb-title">科普社区</div>
      <div class="cb-desc">本土植物科普 · 入侵物种警示 · 识别技巧</div>
    </div>
    <span class="cb-arrow" id="cbArrow"></span>
  </div>

  <!-- 瀑布流列表 -->
  <div class="waterfall" id="waterfall"></div>

  <!-- 列表加载区 -->
  <div id="listFooter"></div>
</div>

<script src="js/photos.js"></script>
<script src="js/images.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/common.js"></script>
<script>
  /* 图标注入 */
  $('#brandIcon').innerHTML = icon('sprout');
  $('#sIcon').innerHTML = icon('search');
  $('#sClear').innerHTML = icon('close');
  $('#cbIcon').innerHTML = icon('book');
  $('#cbArrow').innerHTML = icon('chevronRight');
  $('#fbIcon').innerHTML = icon('filter');
  $('#fbArrow').innerHTML = icon('chevronDown');
  renderTabbar('atlas');

  /* ---------------- 状态 ---------------- */
  const state = { type: '', attr: '', season: '', region: '', kw: '' };
  /* 首页隐藏前 6 个物种（国槐/垂柳/白蜡/西府海棠/月季/金叶女贞，用户端显示为占位，要求移除） */
  const HOME_HIDDEN_IDS = [1, 2, 3, 4, 5, 6];
  const HOME_LIST = PLANTS.filter(p => !HOME_HIDDEN_IDS.includes(p.id));
  let shown = 0;          // 无限滚动已显示数
  const PAGE_SIZE = 12;
  let filtered = [];
  let loadingMore = false;

  /* 区域标签 */
  REGIONS.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = r; b.textContent = r;
    $('[data-group="region"]').appendChild(b);
  });

  /* ---------------- 筛选逻辑 ---------------- */
  function applyFilters() {
    let list = HOME_LIST.filter(p => {
      if (state.type && p.type !== state.type) return false;
      if (state.attr && p.attr !== state.attr) return false;
      if (state.season && !p.seasons.includes(state.season)) return false;
      if (state.region && !p.regions.includes(state.region)) return false;
      if (state.kw) {
        const kw = state.kw.toLowerCase();
        if (!p.name.includes(state.kw) && !p.latin.toLowerCase().includes(kw) && !p.family.includes(state.kw)) return false;
      }
      return true;
    });
    return list;
  }

  /* ---------------- 卡片渲染 ---------------- */
  function cardHTML(p) {
    return `<div class="plant-card hoverable" data-id="${p.id}">
      <div class="pc-img">
        ${imgBoxHTML('pc-box')}
        <div class="pc-shade"></div>
        <div class="pc-overlay">
          <div class="pc-name">${esc(p.name)}</div>
          <div class="pc-latin">${esc(p.latin)}</div>
        </div>
      </div>
      <div class="pc-body">
        <div class="pc-tags">
          <span class="tag ${attrClass(p.attr)}">${attrLabel(p.attr)}</span>
          <span class="tag type">${esc(p.type)}</span>
        </div>
        <div class="pc-family">${esc(p.family)}</div>
        <div class="pc-foot">${icon('pin').replace('width="16" height="16"', 'width="11" height="11"')} 点位 ${p.pointCount}</div>
      </div>
    </div>`;
  }

  function mountCardImgs() {
    $$('#waterfall .plant-card').forEach(card => {
      if (card._mounted) return;
      card._mounted = true;
      const p = getPlant(card.dataset.id);
      mountImg($('.pc-img .img-box', card), plantCover(p.id), { delay: 300 + Math.random() * 500 });
      card.addEventListener('click', () => {
        navigate(`plant-detail.html?id=${p.id}`, `正在查看「${p.name}」`);
      });
    });
  }

  /* 刷新列表（带骨架 loading） */
  function refreshList() {
    shown = 0;
    $('#waterfall').innerHTML = skeletonCardsHTML(6);
    $('#listFooter').innerHTML = '';
    setTimeout(() => {
      filtered = applyFilters();
      updateFilterMeta();
      if (!filtered.length) {
        $('#waterfall').innerHTML = '';
        $('#listFooter').innerHTML = emptyStateHTML({
          title: '没有找到符合条件的植物',
          desc: '换个筛选条件或搜索词试试，\n也可以先逛逛全部植物。',
          btnIcon: 'empty', btnText: '查看全部植物',
        });
        $('#listFooter .btn').addEventListener('click', resetAll);
        return;
      }
      renderMore();
    }, 550);
  }

  function renderMore() {
    const slice = filtered.slice(shown, shown + PAGE_SIZE);
    shown += slice.length;
    const wf = $('#waterfall');
    /* 首批渲染时清掉骨架占位卡，避免慢网下残留空白板块 */
    $$('.sk-card', wf).forEach(sk => sk.remove());
    slice.forEach(p => wf.insertAdjacentHTML('beforeend', cardHTML(p)));
    mountCardImgs();
    updateFooter();
  }

  function updateFooter() {
    const f = $('#listFooter');
    if (shown >= filtered.length) {
      f.innerHTML = filtered.length > PAGE_SIZE ? listEndHTML() : '';
    } else {
      f.innerHTML = listLoadingHTML('加载更多植物');
    }
  }

  /* 无限滚动 */
  window.addEventListener('scroll', () => {
    if (loadingMore || shown === 0 || shown >= filtered.length) return;
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 140) {
      loadingMore = true;
      setTimeout(() => { renderMore(); loadingMore = false; }, 800);
    }
  });

  /* ---------------- 筛选标签交互 ---------------- */
  $$('.chips-scroll').forEach(row => {
    row.addEventListener('click', e => {
      const chip = e.target.closest('.chip');
      if (!chip || chip.parentElement !== row) return;
      $$('.chip', row).forEach(c => c.classList.toggle('active', c === chip));
      state[row.dataset.group] = chip.dataset.v;
      refreshList();
    });
  });

  function resetAll() {
    Object.keys(state).forEach(k => state[k] = '');
    $$('.chips-scroll').forEach(row => $$('.chip', row).forEach((c, i) => c.classList.toggle('active', i === 0)));
    $('#searchInput').value = '';
    $('#searchBar').classList.remove('has-text');
    refreshList();
  }

  /* 筛选栏收起/展开 + 结果摘要 */
  function updateFilterMeta() {
    const on = Object.values(state).filter(k => k).length;
    const total = (typeof filtered !== 'undefined' && filtered.length) ? filtered.length : HOME_LIST.length;
    $('#fbResult').textContent = on ? `已筛选 ${on} 项 · ${total} 种` : `共 ${HOME_LIST.length} 种植物`;
  }
  $('#filterBar').addEventListener('click', () => {
    $('#filterZone').classList.toggle('collapsed');
  });

  /* ---------------- 搜索 ---------------- */
  const doSearch = debounce(() => {
    const kw = $('#searchInput').value.trim();
    state.kw = kw;
    $('#searchBar').classList.remove('searching');
    refreshList();
  }, 700);

  $('#searchInput').addEventListener('input', e => {
    $('#searchBar').classList.toggle('has-text', !!e.target.value.trim());
    $('#searchBar').classList.add('searching');
    doSearch();
  });
  $('#sClear').addEventListener('click', () => {
    $('#searchInput').value = '';
    $('#searchBar').classList.remove('has-text');
    state.kw = '';
    refreshList();
  });

  /* 初始化 */
  updateFilterMeta();
  refreshList();
</script>
</body>
</html>
