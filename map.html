<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>植物分布地图 · 津城植物日志</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/pages.css?v=3">
  <!-- Leaflet 真实地图 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>.drawer-panel{z-index:310!important}.sheet-panel{z-index:310!important}</style>
  <style>.leaflet-tooltip.map-label{background:rgba(255,255,255,.92);border:1px solid #ccc;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:600;color:#333;box-shadow:0 1px 3px rgba(0,0,0,.15);white-space:nowrap}.leaflet-tooltip.map-label::before{display:none}</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="page-title">植物分布地图</div>
    <div class="spacer"></div>
    <button class="h-btn" id="filterBtn"><span id="fIcon"></span>筛选</button>
  </div>
</header>

<div class="page">
  <div class="realmap-wrap">
    <div id="map"></div>
    <!-- 初始化骨架 -->
    <div class="map-loading" id="mapLoading">
      <div class="spinner"></div>
      <span>真实地图加载中…</span>
    </div>
    <!-- 空状态 -->
    <div class="map-empty hidden" id="mapEmpty">
      <div class="me-title">当前筛选条件下暂无观测点位</div>
      <div style="font-size:12px;color:var(--text-3)">试试放宽筛选范围</div>
    </div>
    <div class="map-foot-note" id="footNote"></div>
    <div class="map-legend">
      <span class="lg"><i style="background:#6FA07A"></i>本土植物</span>
      <span class="lg"><i style="background:#C7A36B"></i>外来植物</span>
      <span class="lg"><i style="background:#C0827D"></i>入侵植物</span>
      <span class="lg" style="margin-left:auto">点击圆点查看观测详情 · 滚轮缩放</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/photos.js?v=3"></script>
<script src="js/images.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/storage.js?v=3"></script>
<script src="js/common.js?v=3"></script>
<script>
  $('#fIcon').innerHTML = icon('filter');
  renderTabbar('map');

  /* ---------------- 状态 ---------------- */
  const filter = { type: '', attr: '', region: '' };
  let map = null, locMarker = null, locCircle = null, watchId = null, _dotLayer = null;

  /* ---------------- 初始化真实地图（Leaflet + 高德瓦片） ---------------- */
  function initMap() {
    map = L.map('map', {
      center: [39.12, 117.18],
      zoom: 11,
      minZoom: 8,
      maxZoom: 18,
      zoomControl: true,
      attributionControl: false,
    });
    /* 高德矢量瓦片（无需 key，中文标注） */
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains: ['1', '2', '3', '4'],
      maxZoom: 18,
    }).addTo(map);
    _dotLayer = L.layerGroup().addTo(map);
    renderDots();
  }

  function currentPoints() {
    return MAP_POINTS.filter(pt => {
      const p = getPlant(pt.plantId);
      if (filter.type && p.type !== filter.type) return false;
      if (filter.attr && p.attr !== filter.attr) return false;
      if (filter.region && pt.region !== filter.region) return false;
      return true;
    });
  }

  /* ---------------- 渲染点位（CircleMarker 小圆点） ---------------- */
  const showLabels = () => !!(filter.type || filter.attr || filter.region);
  function renderDots() {
    if (!map || !_dotLayer) return;
    _dotLayer.clearLayers();
    const pts = currentPoints();
    const labeling = showLabels();
    $('#mapEmpty').classList.toggle('hidden', pts.length > 0);
    if (!pts.length) {
      $('#footNote').innerHTML = `${icon('pin').replace('16" height="16', '11" height="11"')} 暂无匹配点位，试试调整筛选`;
      return;
    }
    $('#footNote').innerHTML = `${icon('pin').replace('16" height="16', '11" height="11"')} 已收录天津街道、公园、社区、河岸、街角的植物观测点位 <b>${pts.length}</b> 个${labeling ? ' · 点击圆点查看详情' : ' · 点击筛选可查看标注'}`;

    pts.forEach(pt => {
      const p = getPlant(pt.plantId);
      if (!p) return;
      const [lat, lng] = pointLatLng(pt);
      const m = L.circleMarker([lat, lng], {
        radius: labeling ? 9 : 7,
        color: '#fff',
        weight: 1.5,
        fillColor: attrColor(p.attr),
        fillOpacity: 0.95,
      });
      m.bindPopup(`
        <div style="min-width:150px">
          <div style="font-weight:700;font-size:14px;margin-bottom:2px">${esc(p.name)} <span style="font-size:11px;color:${attrColor(p.attr)}">${attrLabel(p.attr)}</span></div>
          <div style="font-size:12px;color:#666">${esc(pt.region)}区 · ${esc(pt.place)}</div>
          <div style="font-size:11px;color:#999;margin-top:2px">最近观测：${esc(pt.time)}</div>
          <a href="log-detail.html?id=dyn_${pt.id}" style="display:inline-block;margin-top:6px;font-size:12px;color:#4a7a55;font-weight:600">查看观察日志 →</a>
        </div>`, { closeButton: true });
      /* 筛选后显示植物名标注 */
      if (labeling) {
        m.bindTooltip(esc(p.name), { permanent: true, direction: 'top', className: 'map-label', offset: [0, -8] });
      }
      m.addTo(_dotLayer);
    });

    /* 自动适配视野（全量时不缩放，避免每次筛选都跳视野） */
    if (pts.length && !labeling) {
      const latlngs = pts.map(pt => { const [a, b] = pointLatLng(pt); return [a, b]; });
      try { map.fitBounds(L.latLngBounds(latlngs).pad(0.1)); } catch (e) {}
    }
  }

  /* ---------------- 筛选抽屉 ---------------- */
  $('#filterBtn').addEventListener('click', () => {
    showDrawer({
      title: '点位筛选',
      groups: [
        { key: 'type', label: '植物类型', single: true, options: ['全部', ...PLANT_TYPES.map(t => ({ v: t, label: t }))], selected: [filter.type || '全部'] },
        { key: 'attr', label: '物种属性', single: true, options: [{ v: 'native', label: '本土物种' }, { v: 'exotic', label: '外来物种' }, { v: 'invasive', label: '入侵物种' }], selected: filter.attr ? [filter.attr] : [] },
        { key: 'region', label: '天津行政区', single: true, options: REGIONS, selected: filter.region ? [filter.region] : [] },
      ],
      onConfirm(state) {
        filter.type = state.type[0] === '全部' ? '' : (state.type[0] || '');
        filter.attr = state.attr[0] || '';
        filter.region = state.region[0] || '';
        renderDots();
      },
      onReset() {
        filter.type = ''; filter.attr = ''; filter.region = '';
      },
    });
  });

  /* ---------------- 真实定位（跟随移动） ---------------- */
  function startLocation() {
    if (!navigator.geolocation) { showToast('当前浏览器不支持定位'); return; }
    const ok = pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      if (!locMarker) {
        locMarker = L.marker([latitude, longitude], { zIndexOffset: 1000 }).addTo(map);
        locMarker.bindPopup('<b>我的位置</b>').openPopup();
        locCircle = L.circle([latitude, longitude], { radius: accuracy || 50, color: '#4a7a5a', fillColor: '#4a7a5a', fillOpacity: .12, weight: 1 }).addTo(map);
      } else {
        locMarker.setLatLng([latitude, longitude]);
        locCircle.setLatLng([latitude, longitude]);
        locCircle.setRadius(accuracy || 50);
      }
      map.setView([latitude, longitude], 14);
      showToast('已定位到你的真实位置，移动时会持续更新');
    };
    const err = () => showToast('定位失败：请检查浏览器定位权限后重试');
    watchId = navigator.geolocation.watchPosition(ok, err, { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 });
  }

  /* ---------------- 初始化 ---------------- */
  setTimeout(() => {
    $('#mapLoading').classList.add('hidden');
    initMap();
    /* 若浏览器拒绝定位不阻塞地图展示 */
    try { startLocation(); } catch (e) {}
    const target = qs('point');
    if (target) {
      const pt = getPoint(target);
      if (pt) {
        const [lat, lng] = pointLatLng(pt);
        setTimeout(() => {
          map.setView([lat, lng], 15);
          L.circleMarker([lat, lng], { radius: 10, color: '#E07A5F', weight: 2, fillColor: '#E07A5F', fillOpacity: .4 }).addTo(map);
        }, 600);
      }
    }
  }, 400);
</script>
</body>
</html>
