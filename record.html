<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>新建观察记录 · 津城植物日志</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=6">
  <link rel="stylesheet" href="css/pages.css?v=6">
</head>
<body>

<header class="header home-header">
  <div class="header-inner">
    <div class="page-title">新建植物观察记录</div>
    <div class="spacer"></div>
    <button class="h-btn" id="hDraft">保存草稿</button>
    <button class="h-btn strong" id="hSubmit">提交发布</button>
  </div>
</header>

<div class="page">

  <!-- 骨架屏（进入页面时） -->
  <div class="form-skeleton" id="formSkeleton">
    <div class="fs-block"><div class="skeleton" style="height:20px;width:34%"></div>
      <div class="skeleton sk-text mt-12" style="height:100px"></div></div>
    <div class="fs-block"><div class="skeleton" style="height:20px;width:28%"></div>
      <div class="skeleton sk-text mt-12" style="height:120px"></div></div>
    <div class="fs-block"><div class="skeleton" style="height:20px;width:30%"></div>
      <div class="skeleton sk-text mt-12" style="height:52px"></div>
      <div class="skeleton sk-text mt-8" style="height:52px"></div>
      <div class="skeleton sk-text mt-8" style="height:52px"></div></div>
  </div>

  <form id="recordForm" class="hidden" novalidate onsubmit="return false">

    <!-- 图片上传（真实文件选择：电脑弹资源管理器，手机弹相册/相机） -->
    <div class="section-title"><span class="st-bar"></span>现场照片<span class="st-more">最多 9 张 · 支持拍照与相册</span></div>
    <input type="file" id="fileInput" accept="image/*" multiple hidden>
    <div class="upload-zone">
      <button type="button" class="upload-btn" id="btnCamera"><span id="camIcon"></span>拍照上传</button>
      <button type="button" class="upload-btn" id="btnAlbum"><span id="albIcon"></span>从相册选择</button>
    </div>
    <div class="upload-list" id="uploadList"></div>

    <!-- AI 识别 -->
    <div class="section-title"><span class="st-bar"></span>AI 识别<span class="st-more">模拟能力 · 可手动校正</span></div>
    <div class="ai-panel">
      <div class="ai-head"><span style="display:flex"></span>物种识别<span class="ai-badge" id="aiBadge">等待图片</span></div>
      <div id="aiArea">
        <div class="form-hint" style="margin:10px 0 0">上传现场照片后，将自动进行 AI 物种识别。</div>
      </div>
    </div>

    <!-- 定位 -->
    <div class="section-title"><span class="st-bar"></span>观测点位<span class="st-more">必填</span></div>
    <div class="loc-panel">
      <div class="loc-row">
        <span style="color:var(--primary-deep);display:flex" id="locPinIcon"></span>
        <div class="loc-info">
          <div class="loc-place" id="locPlace" style="color:var(--text-3)">尚未获取位置</div>
          <div class="loc-coord" id="locCoord">点击右侧按钮获取当前位置</div>
        </div>
        <button type="button" class="btn btn-soft btn-sm" id="btnLocate"><span id="btnLocateIcon"></span>获取位置</button>
      </div>
      <div class="loc-error hidden" id="locError">
        <span style="flex:none;display:flex;margin-top:2px" id="locErrIcon"></span>
        <div style="flex:1">定位失败：未能获取当前位置，请检查定位权限，或在地图上手动选点。</div>
        <button type="button" class="btn btn-soft btn-sm" style="flex:none" id="btnPickMap">地图选点</button>
      </div>
      <div class="hidden mt-12 center" id="locLoading">
        <div class="radar"><i></i><i></i><i></i><div class="radar-dot"></div></div>
        <div class="fz-12 text-2 mt-8">正在获取位置…</div>
      </div>
    </div>

    <!-- 分层表单 -->
    <div class="section-title"><span class="st-bar"></span>观察信息<span class="st-more">必填项已标注</span></div>
    <div class="form-card">
      <div class="form-group" data-field="stage">
        <div class="form-label">生长阶段<span class="req">*</span></div>
        <div id="fsStage"></div>
        <div class="form-error-tip">请选择生长阶段</div>
      </div>
      <div class="form-group" data-field="health">
        <div class="form-label">健康状态</div>
        <div id="fsHealth"></div>
      </div>
      <div class="form-group">
        <div class="form-label">环境备注</div>
        <textarea class="form-textarea" id="noteInput" placeholder="光照、积水、土壤、周边环境…（例如：向阳处，土壤湿润，紧邻人行道）"></textarea>
      </div>
      <div class="form-group" style="margin-bottom:4px">
        <div class="form-label">生境类型（可多选）</div>
        <div class="check-tags" id="habitatTags"></div>
      </div>
    </div>

    <!-- 底部操作 -->
    <div class="action-bar">
      <button type="button" class="btn btn-ghost" id="draftBtn">保存草稿</button>
      <button type="button" class="btn btn-primary" id="submitBtn">提交发布</button>
    </div>
  </form>
</div>

<script src="js/photos.js?v=6"></script>
<script src="js/images.js?v=6"></script>
<script src="js/data.js?v=6"></script>
<script src="js/storage.js?v=6"></script>
<script src="js/common.js?v=6"></script>
<script>
  $('#camIcon').innerHTML = icon('camera');
  $('#albIcon').innerHTML = icon('image');
  $('#locPinIcon').innerHTML = icon('pin');
  $('#btnLocateIcon').innerHTML = icon('locate');
  $('#locErrIcon').innerHTML = icon('alert');
  $('#aiArea').previousElementSibling.querySelector('span').innerHTML = icon('sprout');
  renderTabbar('record');

  /* ---------------- 状态 ---------------- */
  const form = {
    photoSeeds: [],      // 已上传图片序号（兼容旧逻辑）
    failedSeeds: [],
    photos: [],          // 真实图片 dataURL
    plantId: null, plantName: '', family: '',
    place: '', coords: '',
    stage: '', health: '', note: '', habitats: [],
  };
  let aiRunning = false;

  const HABITATS = ['行道树', '公园绿地', '社区绿地', '河岸湿地', '街角野生植被'];
  $('#habitatTags').innerHTML = HABITATS.map(h => `<button type="button" class="check-tag" data-h="${h}"><span class="ct-dot"></span>${h}</button>`).join('');
  $$('#habitatTags .check-tag').forEach(t => t.addEventListener('click', () => {
    t.classList.toggle('on');
    form.habitats = $$('#habitatTags .check-tag.on').map(x => x.dataset.h);
  }));

  /* ---------------- 真实文件选择（电脑资源管理器 / 手机相册·相机） ---------------- */
  const fileInput = $('#fileInput');
  $('#btnAlbum').addEventListener('click', () => {
    fileInput.removeAttribute('capture');
    fileInput.multiple = true;
    fileInput.value = '';
    fileInput.click();
  });
  $('#btnCamera').addEventListener('click', () => {
    /* 手机上直接唤起相机；电脑上等同选择文件 */
    fileInput.setAttribute('capture', 'environment');
    fileInput.multiple = false;
    fileInput.value = '';
    fileInput.click();
  });

  /* 图片压缩：最大边 1000px，JPEG 0.78（兼顾清晰度与 localStorage 容量） */
  function compressImage(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1000;
          let { width: w, height: h } = img;
          if (w > MAX || h > MAX) {
            const r = Math.min(MAX / w, MAX / h);
            w = Math.round(w * r); h = Math.round(h * r);
          }
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL('image/jpeg', 0.78));
        };
        img.onerror = () => resolve(null);
        img.src = reader.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });
  }

  fileInput.addEventListener('change', async () => {
    const files = [...fileInput.files].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    const room = 9 - form.photos.length - form.failedSeeds.length;
    if (room <= 0) { showToast('最多上传 9 张照片'); return; }
    const use = files.slice(0, room);
    if (files.length > room) showToast(`最多 9 张，已选取前 ${room} 张`);
    for (const f of use) {
      const dataURL = await compressImage(f);
      if (!dataURL) { showToast(`「${f.name}」读取失败，请换一张试试`); continue; }
      addUploadItem(dataURL, f.name);
    }
    fileInput.value = '';
  });

  /* 新增上传卡片：进度条动画 + 真实图片 */
  function addUploadItem(dataURL, name) {
    const list = $('#uploadList');
    const el = document.createElement('div');
    el.className = 'upload-item';
    el.innerHTML = `<div class="up-box">
        <div class="img-box"><img alt=""></div>
        <div class="up-mask"><span class="up-pct">0%</span><div class="progress"><div class="progress-bar"></div></div></div>
      </div>
      <button type="button" class="up-del" title="${esc(name || '')}">${icon('close')}</button>`;
    list.appendChild(el);
    const bar = $('.progress-bar', el), pct = $('.up-pct', el), mask = $('.up-mask', el);
    const img = $('.img-box img', el);
    let p = 0;
    const timer = setInterval(() => {
      p = Math.min(100, p + 6 + Math.random() * 12);
      bar.style.width = p + '%';
      pct.textContent = Math.round(p) + '%';
      if (p >= 100) {
        clearInterval(timer);
        mask.style.opacity = '0';
        setTimeout(() => mask.remove(), 300);
        img.src = dataURL;
        $('.img-box', el).classList.add('done');
        form.photos.push(dataURL);
        form.photoSeeds.push(form.photoSeeds.length + 1);
        bindThumbClick(el);
        scheduleAI();
      }
    }, 80);
  }

  function bindThumbClick(el) {
    if (el._thumbBound) return;
    el._thumbBound = true;
    $('.up-box', el).addEventListener('click', () => {
      if (!form.photos.length) return;
      showImagePreview(form.photos.map(src => ({ src, caption: '现场照片 · 点击左右切换' })));
    });
  }

  $('#uploadList').addEventListener('click', e => {
    const del = e.target.closest('.up-del');
    if (del) {
      const item = del.closest('.upload-item');
      const idx = [...item.parentElement.children].indexOf(item);
      if (form.photos[idx] !== undefined) { form.photos.splice(idx, 1); form.photoSeeds.splice(idx, 1); }
      item.style.opacity = '0';
      setTimeout(() => item.remove(), 200);
    }
  });

  /* ---------------- AI 识别模拟 ---------------- */
  let aiTimer = null;
  function scheduleAI() {
    clearTimeout(aiTimer);
    aiTimer = setTimeout(startAI, 700);
  }

  function startAI() {
    if (aiRunning || !form.photos.length) return;
    aiRunning = true;
    $('#aiBadge').textContent = '识别中';
    const target = PLANTS[(form.photos.length * 5 + form.photoSeeds.length * 3) % PLANTS.length];
    const fail = Math.random() < 0.18;
    $('#aiArea').innerHTML = `
      <div class="ai-scanning">
        <div class="ai-scan-box"><img src="${form.photos[0]}" alt=""></div>
        <div style="flex:1">
          <div class="fz-14 bold" style="color:var(--primary-dark)">AI 识别中…</div>
          <div class="fz-12 text-2 mt-8">正在分析叶片纹理与花器特征</div>
        </div>
      </div>`;
    setTimeout(() => {
      aiRunning = false;
      if (fail) {
        $('#aiBadge').textContent = '识别失败';
        $('#aiArea').innerHTML = `
          <div class="ai-fail"><span style="flex:none;display:flex">${icon('alert')}</span>
            <div style="flex:1">未能识别该物种，置信度过低。可重试，或手动录入物种名称。</div></div>
          <div class="flex mt-12" style="gap:10px">
            <button type="button" class="btn btn-ghost btn-sm" style="flex:1" id="aiRetry">重新识别</button>
            <button type="button" class="btn btn-primary btn-sm" style="flex:1" id="aiManual">手动录入</button>
          </div>`;
        $('#aiRetry').addEventListener('click', () => { form._forceAI = true; startAI(); });
        $('#aiManual').addEventListener('click', () => showAIResult(null, true));
        return;
      }
      showAIResult(target);
    }, 1900);
  }

  function showAIResult(target, manual = false) {
    $('#aiBadge').textContent = manual ? '手动录入' : '识别完成';
    form.plantId = target ? target.id : null;
    form.plantName = target ? target.name : '';
    form.family = target ? target.family : '';
    /* 手动录入模式：可直接输入；AI 识别成功：锁定展示 + 修正申请入口 */
    const nameField = manual
      ? `<div class="form-group" style="margin:12px 0 0" data-field="plant">
          <div class="form-label">物种名称（手动录入）<span class="req">*</span></div>
          <input class="form-input" id="plantNameInput" value="${esc(form.plantName)}" placeholder="请输入物种名称">
          <div class="form-error-tip">请填写物种名称</div>
        </div>`
      : `<div class="form-group" style="margin:12px 0 0" data-field="plant">
          <div class="form-label">识别结果（如有误可提交修正申请）<span class="req">*</span></div>
          <div class="ai-locked">
            <span class="ai-locked-name" id="plantNameShow">${esc(form.plantName) || '待识别'}</span>
            <button type="button" class="btn btn-soft btn-sm" id="btnCorrection">${icon('edit').replace('22" height="22', '13" height="13"')} 修正申请</button>
          </div>
          <div class="ai-corr-status hidden" id="corrStatus"></div>
        </div>`;
    $('#aiArea').innerHTML = `
      ${target ? `
      <div class="ai-result">
        <div class="flex-between">
          <div>
            <div class="ai-species" style="color:var(--primary-dark)">识别为：${esc(target.name)}</div>
            <div class="ai-family">${esc(target.latin)} · ${esc(target.family)} · 置信度 92.6%</div>
          </div>
          <span class="tag ${attrClass(target.attr)}">${attrLabel(target.attr)}</span>
        </div>
      </div>` : `<div class="ai-fail" style="background:var(--bg-soft);color:var(--text-2)"><span style="flex:none;display:flex">${icon('edit')}</span>已切换为手动录入模式</div>`}
      ${nameField}`;
    const input = $('#plantNameInput');
    if (input) input.addEventListener('input', () => form.plantName = input.value.trim());
    const corrBtn = $('#btnCorrection');
    if (corrBtn) corrBtn.addEventListener('click', openCorrectionSheet);
    renderCorrStatus();
  }

  /* ---------------- 物种名称修正申请 ---------------- */
  function myCorrections() { return UD.get('corrections', []); }

  function openCorrectionSheet() {
    if (!Auth.current()) { requireLoginToast(); return; }
    const current = form.plantName || '待识别';
    const { close, panel } = showSheet('物种名称修正申请', `
      <div class="corr-tip">识别结果与实际不符？填写建议名称与理由，提交后由植物学志愿者审核，审核通过将更新记录并通知你。</div>
      <div class="form-group">
        <div class="form-label">当前识别结果</div>
        <input class="form-input" value="${esc(current)}" disabled>
      </div>
      <div class="form-group">
        <div class="form-label">建议修正为<span class="req">*</span></div>
        <input class="form-input" id="corrName" maxlength="20" placeholder="请输入正确的物种名称">
      </div>
      <div class="form-group">
        <div class="form-label">修正理由<span class="req">*</span></div>
        <textarea class="form-textarea" id="corrReason" maxlength="120" placeholder="例如：叶为羽状复叶、果实念珠状荚果，更符合国槐特征"></textarea>
      </div>
      <button type="button" class="btn btn-primary btn-block mt-8" id="corrSubmit">提交修正申请</button>`);
    panel.querySelector('#corrSubmit').addEventListener('click', () => {
      const name = panel.querySelector('#corrName').value.trim();
      const reason = panel.querySelector('#corrReason').value.trim();
      if (!name) { showToast('请填写建议修正的物种名称'); return; }
      if (!reason) { showToast('请填写修正理由'); return; }
      if (name === current) { showToast('建议名称与当前识别一致，无需修正'); return; }
      const list = myCorrections();
      list.unshift({
        id: 'c' + Date.now().toString(36),
        from: current, to: name, reason,
        plantId: form.plantId, time: _nowFull(),
        status: 'pending',
      });
      UD.set('corrections', list);
      close();
      showToast('修正申请已提交，等待审核');
      renderCorrStatus();
    });
  }

  function renderCorrStatus() {
    const box = $('#corrStatus');
    if (!box) return;
    const mine = myCorrections().filter(c => c.from === form.plantName);
    if (!mine.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
    const c = mine[0];
    const st = { pending: ['审核中', 'soft'], approved: ['已通过', 'native'], rejected: ['未通过', 'invasive'] }[c.status] || ['审核中', 'soft'];
    box.classList.remove('hidden');
    box.innerHTML = `<span class="tag ${st[1]}">修正申请 · ${st[0]}</span> 建议「${esc(c.from)}」→「${esc(c.to)}」 · ${esc(c.time)}`;
  }

  /* ---------------- 定位 ---------------- */
  $('#btnLocate').addEventListener('click', () => {
    const btn = $('#btnLocate');
    if (btn.disabled) return;
    btn.disabled = true;
    $('#locError').classList.add('hidden');
    $('#locLoading').classList.remove('hidden');
    setTimeout(() => {
      btn.disabled = false;
      $('#locLoading').classList.add('hidden');
      if (Math.random() < 0.18) {
        $('#locError').classList.remove('hidden');
        return;
      }
      const pt = MAP_POINTS[Math.floor(Math.random() * MAP_POINTS.length)];
      const region = pt.region, place = pt.place.split('·').pop().trim();
      const plantNear = getPlant(pt.plantId);
      if (!form.plantId) { form.plantId = plantNear.id; }
      fillLocation(`${region}区 · ${place}`, `${(117 + Math.random()).toFixed(4)}°E, ${(39 + Math.random() * 0.3).toFixed(4)}°N`);
      showToast('定位成功');
    }, 1100);
  });

  function fillLocation(place, coords) {
    form.place = place; form.coords = coords;
    $('#locPlace').textContent = place;
    $('#locPlace').style.color = 'var(--text)';
    $('#locCoord').textContent = coords;
  }

  /* 地图选点弹窗 */
  $('#btnPickMap').addEventListener('click', () => {
    const { close, panel } = showSheet('地图选点', `
      <div class="fz-12 text-2" style="margin-bottom:10px">在地图上点击任意位置放置图钉，确认后自动填充观测点位。</div>
      <div class="mini-map" id="pickMap" style="height:300px;cursor:crosshair">
        <div class="map-canvas" id="pickCanvas"></div>
      </div>
      <div class="fz-13 mt-12" style="text-align:center;color:var(--text-2)" id="pickInfo">尚未选点</div>
      <button type="button" class="btn btn-primary btn-block mt-16" id="pickOk" disabled>确认选点</button>`);
    const pc = panel.querySelector('#pickCanvas');
    pc.innerHTML = TJ_MAP_SVG;
    Object.entries(REGION_POS).forEach(([name, [x, y]]) => {
      const lb = document.createElement('span');
      lb.className = 'map-region-label';
      lb.style.left = x + '%'; lb.style.top = y + '%';
      lb.textContent = name;
      pc.appendChild(lb);
    });
    let picked = null;
    panel.querySelector('#pickMap').addEventListener('click', e => {
      if (e.target.closest('.map-region-label')) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width * 100;
      const y = (e.clientY - rect.top) / rect.height * 100;
      pc.querySelectorAll('.map-user-pin').forEach(p => p.remove());
      const pin = document.createElement('div');
      pin.className = 'map-user-pin';
      pin.style.left = x + '%'; pin.style.top = y + '%';
      pin.innerHTML = `<svg width="30" height="30" viewBox="0 0 24 24" fill="#46604C"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7Z"/><circle cx="12" cy="9" r="3" fill="#fff"/></svg>`;
      pc.appendChild(pin);
      /* 最近区域 */
      let best = null, bd = 1e9;
      Object.entries(REGION_POS).forEach(([name, [rx, ry]]) => {
        const d = Math.hypot(rx - x, ry - y);
        if (d < bd) { bd = d; best = name; }
      });
      picked = { x, y, region: best };
      panel.querySelector('#pickInfo').innerHTML = `已选择：<b style="color:var(--primary-deep)">${best}区</b> 附近 (x:${x.toFixed(1)}%, y:${y.toFixed(1)}%)`;
      panel.querySelector('#pickOk').disabled = false;
    });
    panel.querySelector('#pickOk').addEventListener('click', () => {
      const streets = ['海河沿岸', '社区口袋公园', '街道转角绿地', '滨河步道', '公园北门'];
      const s = streets[Math.floor(Math.random() * streets.length)];
      fillLocation(`${picked.region}区 · ${s}`, `${(116.8 + picked.x / 100 * 0.8).toFixed(4)}°E, ${(38.6 + picked.y / 100 * 0.9).toFixed(4)}°N`);
      close();
      showToast('已通过地图选点填充位置');
    });
  });

  /* ---------------- 下拉 ---------------- */
  $('#fsStage').innerHTML = fakeSelectHTML(['发芽', '展叶', '开花', '结果', '落叶', '休眠'], { placeholder: '请选择生长阶段', name: 'stage' });
  $('#fsHealth').innerHTML = fakeSelectHTML(['健康', '病虫害', '枯萎', '缺水', '人为损伤'], { placeholder: '请选择健康状态（选填）', name: 'health' });
  initFakeSelects(document, (name, v) => { form[name] = v; });

  /* ---------------- 草稿恢复 ---------------- */
  const draftId = qs('draft');
  if (draftId) {
    const d = DB.getDraft(draftId);
    if (d) {
      form.plantName = d.plantName || ''; form.family = d.family || '';
      form.place = d.place || ''; form.coords = d.coords || '';
      form.stage = d.stage || ''; form.health = d.health || ''; form.note = d.note || '';
      form.habitats = d.stage2 ? [d.stage2] : [];
      showAIResult(getPlant(d.plantId) || null, !d.plantId);
      (d.photos || []).forEach(src => addUploadItem(src, '草稿照片'));
      if (form.place) fillLocation(form.place, form.coords);
      $('#fsStage .fake-select').dataset.value = form.stage;
      $('#fsStage .fs-text').textContent = form.stage || '请选择生长阶段';
      form.habitats.forEach(h => $(`#habitatTags .check-tag[data-h="${h}"]`)?.classList.add('on'));
      $('#noteInput').value = form.note;
      showToast('已恢复草稿内容，可继续编辑');
    }
  }

  /* ---------------- 保存草稿 ---------------- */
  function saveDraft() {
    if (!Auth.current()) { requireLoginToast(); return; }
    if (!form.plantName && !form.place && !form.photoSeeds.length) {
      showErrorModal('空记录无法保存为草稿，\n请至少填写物种名称或上传照片。', '无法保存');
      return;
    }
    const btn = $('#draftBtn');
    btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> 保存中…';
    setTimeout(() => {
      const drafts = UD.get('drafts', []);
      const data = {
        plantId: form.plantId, plantName: form.plantName, family: form.family,
        place: form.place, coords: form.coords, stage: fsValue('stage'), health: fsValue('health'),
        note: $('#noteInput').value, photoSeeds: form.photoSeeds.slice(0, 3),
        photos: form.photos.slice(0, 3),
        stage2: form.habitats[0] || '', time: _nowFull(),
      };
      if (draftId) {
        const i = drafts.findIndex(x => x.id === draftId);
        if (i >= 0) drafts[i] = { ...drafts[i], ...data };
        else drafts.push({ id: draftId, ...data });
      } else {
        drafts.push({ id: 'd' + Date.now().toString(36), ...data });
      }
      UD.set('drafts', drafts);
      btn.disabled = false; btn.textContent = '保存草稿';
      showModal({
        icon: 'success', title: '草稿已保存',
        content: '草稿已存入「我的 · 观察日志」草稿箱，\n可随时回来继续编辑。',
        confirmText: '继续编辑', cancelText: '去看看',
        onConfirm: () => { },
        onCancel: () => navigate('my-logs.html', '正在前往我的日志'),
      });
    }, 800);
  }
  $('#draftBtn').addEventListener('click', saveDraft);
  $('#hDraft').addEventListener('click', saveDraft);

  /* ---------------- 提交发布 ---------------- */
  function submit() {
    if (!Auth.current()) { requireLoginToast(); return; }
    form.stage = fsValue('stage');
    form.health = fsValue('health');
    form.note = $('#noteInput').value;
    const missing = [];
    if (!form.plantName) missing.push('物种名称（AI 识别或手动录入）');
    if (!form.place) missing.push('观测点位（获取定位或地图选点）');
    if (!form.stage) missing.push('生长阶段');
    if (missing.length) {
      $$('#recordForm .form-group').forEach(g => g.classList.remove('error'));
      if (!form.plantName) $('#recordForm [data-field="plant"]')?.classList.add('error');
      if (!form.stage) $('#recordForm [data-field="stage"]')?.classList.add('error');
      showModal({
        icon: 'error', title: '还有必填项未完成',
        content: missing.map(m => '· ' + m).join('\n'),
        confirmText: '去补充',
      });
      return;
    }
    const btn = $('#submitBtn');
    btn.disabled = true; btn.innerHTML = '<div class="spinner" style="border-top-color:#fff"></div> 发布中…';
    setTimeout(() => {
      const logId = DB.addLog({
        plantId: form.plantId, plantName: form.plantName, family: form.family,
        place: form.place, coords: form.coords || '117.2000°E, 39.1200°N',
        stage: form.stage, health: form.health || '健康', note: form.note || '（无备注）',
        habitats: form.habitats,
        photos: form.photos.slice(0, 6),
        photoSeeds: form.photoSeeds.length ? form.photoSeeds : [1, 2],
        time: _nowFull(), taskId: qs('task') || null,
      });
      if (draftId) DB.removeDraft(draftId);
      btn.disabled = false; btn.textContent = '提交发布';
      showModal({
        icon: 'success', title: '发布成功',
        content: '你的观察记录已发布！\n感谢为城市植物档案添上一笔。',
        confirmText: '查看这条日志', cancelText: '再记一条',
        onConfirm: () => navigate(`log-detail.html?id=${logId}`, '正在查看日志'),
        onCancel: () => location.reload(),
      });
    }, 1300);
  }
  $('#submitBtn').addEventListener('click', submit);
  $('#hSubmit').addEventListener('click', submit);

  /* ---------------- 进入页面：骨架屏 → 表单 ---------------- */
  setTimeout(() => {
    $('#formSkeleton').classList.add('hidden');
    $('#recordForm').classList.remove('hidden');
    initCollapsibles();
  }, 650);
</script>
</body>
</html>
